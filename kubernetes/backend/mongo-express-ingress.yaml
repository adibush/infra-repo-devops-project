apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: mongo-express-ingress
  namespace: hotel-project

spec:
  ingressClassName: nginx

  rules:
    - host: localhost

      http:
        paths:

          - path: /mongo
            pathType: Prefix

            backend:
              service:
                name: mongo-express-service

                port:
                  number: 8081
