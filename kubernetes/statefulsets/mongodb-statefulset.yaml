apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: hotel-project

spec:
  serviceName: mongodb-headless-service
  replicas: 3

  selector:
    matchLabels:
      app: mongodb-replica

  template:
    metadata:
      labels:
        app: mongodb-replica

    spec:
      initContainers:
        - name: prepare-mongodb-keyfile

          image: mongo:8.0

          imagePullPolicy: IfNotPresent

          command:
            - bash
            - -c

          args:
            - |
              set -e
              cp /keyfile-source/mongodb-keyfile /keyfile/mongodb-keyfile
              chown 999:999 /keyfile/mongodb-keyfile
              chmod 400 /keyfile/mongodb-keyfile

          volumeMounts:
            - name: mongodb-keyfile-secret
              mountPath: /keyfile-source
              readOnly: true

            - name: mongodb-keyfile
              mountPath: /keyfile

      containers:
        - name: mongodb

          image: mongo:8.0

          imagePullPolicy: IfNotPresent

          args:
            - --replSet
            - rs0
            - --bind_ip_all
            - --auth
            - --keyFile
            - /etc/mongodb-keyfile/mongodb-keyfile

          ports:
            - name: mongodb
              containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true

      volumes:
        - name: mongodb-keyfile
          emptyDir: {}

        - name: mongodb-keyfile-secret
          secret:
            secretName: mongodb-keyfile-secret
            defaultMode: 0400

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 1Gi
